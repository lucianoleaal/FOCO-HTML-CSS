<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-style: italic;
            font-weight: bolder;
        }

        a {
            color: red;
            text-decoration: none;
        }

        a:visited {
            color: darkred;
        }

        a:hover {
            text-decoration: underline;
            color: black;
        }

        a:active {
            color: green;
        }

        a::before {
            content: ' ➡️ ';
        }

        a::after {
            content: ' ⬅️ ';
        }        
    </style>
</head>
<body>
    <H1>Personalizando links</H1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io" target="_blank">Repositório do github</a></li>
        <li><a href="https://youtube.com/cursoemvideo/">Canal do youtube</a></li>
        <li><a href="https://www.cursoemvideo.com">Site do curso em video</a></li>
    </ul>
</body>
</html>
